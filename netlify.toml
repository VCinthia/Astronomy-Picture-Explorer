# Netlify production deployment configuration for Astronomy Picture Explorer.
# P3_RENDER_API_ORIGIN is substituted by scripts/prepare-netlify-redirects.mjs only
# during a Netlify build. The committed placeholder must never route real browser traffic.

[build]
  command = "node scripts/prepare-netlify-redirects.mjs && npm run build"
  # Angular's application builder emits the browser bundle under /browser.
  publish = "dist/astronomy-picture-explorer/browser"

[build.environment]
  # Angular 22 requires Node 22.22.3 or later. Pin the minimum supported
  # runtime so Netlify does not silently select its older Node 20 default.
  NODE_VERSION = "22.22.3"

# These are signed, same-origin proxy rewrites to Render. Netlify injects the key named
# by `signed` at request time as an HMAC JWS header; its secret value never enters Git
# or the built frontend. Netlify Free permits at most two code-based rate-limit rules,
# so one visitor-IP budget covers the complete auth surface and a second covers the API.
# Email-specific account limits remain enforced by the API before Resend is called.
[[redirects]]
  from = "/auth/*"
  to = "https://render-api-origin.invalid/auth/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SIGNING_KEY"
  [redirects.rate_limit]
    window_limit = 10
    window_size = 180
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/*"
  to = "https://render-api-origin.invalid/api/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SIGNING_KEY"
  [redirects.rate_limit]
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]

# SPA fallback: deep links (e.g. /explorer) must serve index.html so the
# Angular router can resolve the route client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
