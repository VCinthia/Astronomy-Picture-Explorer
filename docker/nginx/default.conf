server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser traffic same-origin. These paths are not rewritten by the SPA fallback.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Development-only fixture served by the internal NASA mock. It lets local UI
    # checks render an APOD card without a provider key or external request.
    location /local-apod/ {
        proxy_pass http://nasa-mock:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
