<div class="min-h-screen bg-space-base pb-14 md:pb-0">
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-20 focus:rounded-button focus:bg-space-surface-hi focus:px-4 focus:py-2 focus:text-meta focus:text-content-primary focus:outline-2 focus:outline-accent"
  >
    Skip to content
  </a>
  <header
    class="sticky top-0 z-10 border-b border-space-border bg-space-base/90 backdrop-blur"
  >
    <div
      class="mx-auto flex h-14 max-w-content items-center justify-between gap-4 px-page lg:h-16"
    >
      <a
        routerLink="/home"
        aria-label="Astronomy Explorer"
        class="flex items-center gap-2 text-logo font-semibold text-content-primary focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
      >
        <span aria-hidden="true" class="text-accent">✦</span>
        <span class="hidden sm:inline">Astronomy Explorer</span>
      </a>

      <div class="flex items-center gap-2 sm:gap-3">
        <nav class="hidden items-center gap-1 text-meta md:flex" aria-label="Primary">
          <a
            routerLink="/home"
            #homeActive="routerLinkActive"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.text-accent]="homeActive.isActive"
            [class.text-content-secondary]="!homeActive.isActive"
            class="rounded-button px-3 py-1.5 transition hover:text-content-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            Home
          </a>
          <a
            routerLink="/explorer"
            #exploreActive="routerLinkActive"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.text-accent]="exploreActive.isActive"
            [class.text-content-secondary]="!exploreActive.isActive"
            class="rounded-button px-3 py-1.5 transition hover:text-content-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            Explore
          </a>
          <a
            routerLink="/favorites"
            #favoritesActive="routerLinkActive"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.text-accent]="favoritesActive.isActive"
            [class.text-content-secondary]="!favoritesActive.isActive"
            class="rounded-button px-3 py-1.5 transition hover:text-content-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            Favorites
          </a>
        </nav>

        @if (auth.isAuthenticated()) {
          <button
            type="button"
            (click)="logout()"
            class="rounded-button px-3 py-1.5 text-meta font-medium text-content-secondary transition hover:text-content-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            Sign out
          </button>
        } @else {
          <a
            routerLink="/login"
            class="rounded-button px-3 py-1.5 text-meta font-medium text-content-secondary transition hover:text-content-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            Sign in
          </a>
        }

        <div class="flex items-center gap-2" role="group" aria-label="Step through dates">
          <button
            type="button"
            (click)="prev()"
            [disabled]="!canPrev()"
            aria-label="Previous date"
            class="flex size-9 items-center justify-center rounded-button bg-space-surface-hi text-nav text-content-secondary transition hover:text-content-primary disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <span
            class="min-w-24 text-center text-meta font-medium text-content-primary"
            aria-live="polite"
          >
            {{ formattedDate() }}
          </span>
          <button
            type="button"
            (click)="next()"
            [disabled]="!canNext()"
            aria-label="Next date"
            class="flex size-9 items-center justify-center rounded-button bg-space-surface-hi text-nav text-content-secondary transition hover:text-content-primary disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="mx-auto max-w-content px-page py-10 lg:py-14">
    <router-outlet />
  </main>

  <footer class="mt-12 border-t border-space-border">
    <div
      class="mx-auto flex max-w-content flex-col items-start gap-4 px-page py-8 text-caption text-content-secondary sm:flex-row sm:items-center sm:justify-between"
    >
      <p>
        Created {{ siteCreated }} · Built by {{ authorName }} · Imagery from
        <a
          href="https://apod.nasa.gov"
          target="_blank"
          rel="noopener noreferrer"
          class="underline decoration-space-border underline-offset-2 transition hover:text-content-primary"
        >
          NASA APOD
        </a>
      </p>
      <a
        [href]="authorSiteUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-1.5 rounded-button border border-space-border bg-space-surface-hi px-4 py-2 text-meta font-medium text-content-primary transition hover:border-accent hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      >
        Visit my portfolio
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7 17 17 7" />
          <path d="M7 7h10v10" />
        </svg>
      </a>
    </div>
  </footer>

  <app-bottom-nav />
</div>
